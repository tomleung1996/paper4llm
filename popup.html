<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper for LLMs</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="title-row">
        <div>
          <h1>Paper for LLMs</h1>
          <p data-i18n="tagline">Turn papers into citation-linked Markdown.</p>
        </div>
        <span id="site-badge" class="badge" data-i18n="checkingPage">Checking page…</span>
      </header>

      <section class="options" data-i18n-aria-label="conversionOptions" aria-label="Conversion options">
        <label>
          <input id="include-frontmatter" type="checkbox" checked />
          <span data-i18n="yamlMetadata">YAML metadata</span>
        </label>
        <label>
          <input id="include-images" type="checkbox" checked />
          <span data-i18n="imageLinks">Image links</span>
        </label>
        <label class="language-option">
          <span data-i18n="interfaceLanguage">Language</span>
          <select id="language-preference">
            <option value="auto" data-i18n="languageAuto">Auto</option>
            <option value="zh-CN">中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </section>

      <button id="convert" class="primary" type="button" data-i18n="convertCurrentPaper">Convert current paper</button>

      <section id="report" class="report" hidden>
        <div class="metric"><span data-i18n="metricReferences">References</span><strong id="reference-count">0</strong></div>
        <div class="metric"><span data-i18n="metricResolved">Linked citations</span><strong id="resolved-count">0</strong></div>
        <div class="metric"><span data-i18n="metricUnresolved">Unlinked citations</span><strong id="unresolved-count">0</strong></div>
      </section>

      <p id="status" class="status" role="status" data-i18n="supportedPageDefault">Open a supported paper page to use this extension.</p>
      <ul id="warnings" class="warnings" hidden></ul>

      <section id="result-panel" hidden>
        <textarea id="markdown" spellcheck="false" data-i18n-aria-label="markdownOutput" aria-label="Markdown output"></textarea>
        <div class="actions">
          <button id="copy" type="button" data-i18n="copyMarkdown">Copy Markdown</button>
          <button id="download" type="button" data-i18n="downloadMarkdown">Download .md</button>
        </div>
      </section>
    </main>
    <script src="src/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
